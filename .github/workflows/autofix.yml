name: autofix.ci

on:
  push:
  pull_request:
    branches: ["main"]
permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - run: npm ci
        env:
          LEFTHOOK: 0
      - run: npx ultracite fix --quiet --type-aware --type-check --format=github
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a