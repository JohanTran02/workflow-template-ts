name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

permissions:
  contents: read

jobs:
  lint_format_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        env:
          LEFTHOOK: 0
        run: npm ci
      - name: Verify Lint/Format
        run: npx ultracite check --quiet --type-aware --type-check --format=github

  build:
    runs-on: ubuntu-latest
    needs: lint_format_check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        env:
          LEFTHOOK: 0
        run: npm ci
      - name: Build
        run: npm run build --if-present