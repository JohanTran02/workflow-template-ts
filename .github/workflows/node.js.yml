name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        env:
          LEFTHOOK: 0
        run: npm ci

      - name: Run lefthook CI checks
        run: npx lefthook run ci
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a